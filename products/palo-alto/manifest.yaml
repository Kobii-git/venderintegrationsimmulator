id: palo-alto
display_name: Palo Alto PAN-OS
version: 1.0.0
supported_modes:
- push_webhook
supported_auth_methods:
- none
- basic
- bearer
- api_key_header
scenarios:
- id: traffic
  display_name: Traffic
  description: Synthetic PAN-OS 11.1 traffic event. See source field reference.
  default_transport: syslog
  template: scenarios/traffic.json
  config_schema: &id001
    type: object
    additionalProperties: false
    properties:
      hostname:
        type: string
        default: sim-device-01
      device_ip:
        type: string
        default: 192.0.2.10
      src:
        type: string
        default: 198.51.100.20
      dst:
        type: string
        default: 203.0.113.10
      user:
        type: string
        default: labuser
      spt:
        type: integer
        default: 49152
      dpt:
        type: integer
        default: 443
  supported_modes:
  - push_webhook
- id: threat
  display_name: Threat
  description: Synthetic PAN-OS 11.1 threat event. See source field reference.
  default_transport: syslog
  template: scenarios/threat.json
  config_schema: *id001
  supported_modes:
  - push_webhook
- id: url-filtering
  display_name: Url Filtering
  description: Synthetic PAN-OS 11.1 url-filtering event. See source field reference.
  default_transport: syslog
  template: scenarios/url-filtering.json
  config_schema: *id001
  supported_modes:
  - push_webhook
- id: vpn
  display_name: Vpn
  description: Synthetic PAN-OS 11.1 vpn event. See source field reference.
  default_transport: syslog
  template: scenarios/vpn.json
  config_schema: *id001
  supported_modes:
  - push_webhook
- id: configuration
  display_name: Configuration
  description: Synthetic PAN-OS 11.1 configuration event. See source field reference.
  default_transport: syslog
  template: scenarios/configuration.json
  config_schema: *id001
  supported_modes:
  - push_webhook
supported_transports:
- syslog
- http_webhook
- azure_logs_ingestion
formats:
- csv
- cef
field_references:
- https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/monitoring/use-syslog-for-monitoring/syslog-field-descriptions
schema_version: PAN-OS 11.1
compatibility: Representative synthetic wire format; live vendor parser validation
  required
