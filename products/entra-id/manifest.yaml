id: entra-id
display_name: Microsoft Entra ID
version: 1.0.0
supported_modes:
- push_webhook
supported_auth_methods:
- none
- basic
- bearer
- api_key_header
scenarios:
- id: sign-in
  display_name: Sign In
  description: Synthetic SigninLogs / AuditLogs schema sign-in event. See source field
    reference.
  default_transport: http_webhook
  template: scenarios/sign-in.json
  config_schema: &id001
    type: object
    additionalProperties: false
    properties:
      hostname:
        type: string
        default: sim-device-01
      device_ip:
        type: string
        default: 192.0.2.10
      src:
        type: string
        default: 198.51.100.20
      dst:
        type: string
        default: 203.0.113.10
      user:
        type: string
        default: labuser
      spt:
        type: integer
        default: 49152
      dpt:
        type: integer
        default: 443
  supported_modes:
  - push_webhook
- id: directory-audit
  display_name: Directory Audit
  description: Synthetic SigninLogs / AuditLogs schema directory-audit event. See
    source field reference.
  default_transport: http_webhook
  template: scenarios/directory-audit.json
  config_schema: *id001
  supported_modes:
  - push_webhook
- id: provisioning
  display_name: Provisioning
  description: Synthetic SigninLogs / AuditLogs schema provisioning event. See source
    field reference.
  default_transport: http_webhook
  template: scenarios/provisioning.json
  config_schema: *id001
  supported_modes:
  - push_webhook
supported_transports:
- syslog
- http_webhook
- azure_logs_ingestion
formats:
- json
field_references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/signinlogs
schema_version: SigninLogs / AuditLogs schema
compatibility: Synthetic ingestion; native service connector not reproduced
