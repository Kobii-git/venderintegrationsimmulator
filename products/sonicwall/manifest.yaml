id: sonicwall
display_name: SonicWall
version: 1.0.0
supported_modes:
- push_webhook
supported_auth_methods:
- none
- basic
- bearer
- api_key_header
scenarios:
- id: traffic
  display_name: Traffic
  description: Synthetic SonicOS 7 traffic event. See source field reference.
  default_transport: syslog
  template: scenarios/traffic.json
  config_schema: &id001
    type: object
    additionalProperties: false
    properties:
      hostname:
        type: string
        default: sim-device-01
      device_ip:
        type: string
        default: 192.0.2.10
      src:
        type: string
        default: 198.51.100.20
      dst:
        type: string
        default: 203.0.113.10
      user:
        type: string
        default: labuser
      spt:
        type: integer
        default: 49152
      dpt:
        type: integer
        default: 443
  supported_modes:
  - push_webhook
- id: threat
  display_name: Threat
  description: Synthetic SonicOS 7 threat event. See source field reference.
  default_transport: syslog
  template: scenarios/threat.json
  config_schema: *id001
  supported_modes:
  - push_webhook
- id: vpn
  display_name: Vpn
  description: Synthetic SonicOS 7 vpn event. See source field reference.
  default_transport: syslog
  template: scenarios/vpn.json
  config_schema: *id001
  supported_modes:
  - push_webhook
- id: authentication
  display_name: Authentication
  description: Synthetic SonicOS 7 authentication event. See source field reference.
  default_transport: syslog
  template: scenarios/authentication.json
  config_schema: *id001
  supported_modes:
  - push_webhook
supported_transports:
- syslog
- http_webhook
- azure_logs_ingestion
formats:
- native
- cef
field_references:
- https://www.sonicwall.com/support/technical-documentation/docs/sonicos-7-0-0-0-device_log/Content/Logs_Syslog/settings-syslog.htm
schema_version: SonicOS 7
compatibility: Representative synthetic wire format; live vendor parser validation
  required
