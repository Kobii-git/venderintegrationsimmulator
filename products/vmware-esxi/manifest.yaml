id: vmware-esxi
display_name: VMware ESXi
version: 1.0.0
supported_modes:
- push_webhook
supported_auth_methods:
- none
- basic
- bearer
- api_key_header
scenarios:
- id: authentication
  display_name: Authentication
  description: Synthetic ESXi 8 authentication event. See source field reference.
  default_transport: syslog
  template: scenarios/authentication.json
  config_schema: &id001
    type: object
    additionalProperties: false
    properties:
      hostname:
        type: string
        default: sim-device-01
      device_ip:
        type: string
        default: 192.0.2.10
      src:
        type: string
        default: 198.51.100.20
      dst:
        type: string
        default: 203.0.113.10
      user:
        type: string
        default: labuser
      spt:
        type: integer
        default: 49152
      dpt:
        type: integer
        default: 443
  supported_modes:
  - push_webhook
- id: host-management
  display_name: Host Management
  description: Synthetic ESXi 8 host-management event. See source field reference.
  default_transport: syslog
  template: scenarios/host-management.json
  config_schema: *id001
  supported_modes:
  - push_webhook
- id: vm-operation
  display_name: Vm Operation
  description: Synthetic ESXi 8 vm-operation event. See source field reference.
  default_transport: syslog
  template: scenarios/vm-operation.json
  config_schema: *id001
  supported_modes:
  - push_webhook
supported_transports:
- syslog
- http_webhook
- azure_logs_ingestion
- azure_function_app
formats:
- native
field_references:
- https://knowledge.broadcom.com/external/article?legacyId=2032076
schema_version: ESXi 8
compatibility: Representative synthetic wire format; live vendor parser validation
  required
