id: watchguard
display_name: WatchGuard Firebox
version: 1.0.0
supported_modes:
- push_webhook
supported_auth_methods:
- none
- basic
- bearer
- api_key_header
scenarios:
- id: allow
  display_name: Allow
  description: Synthetic Fireware 12 allow event. See source field reference.
  default_transport: syslog
  template: scenarios/allow.json
  config_schema: &id001
    type: object
    additionalProperties: false
    properties:
      hostname:
        type: string
        default: sim-device-01
      device_ip:
        type: string
        default: 192.0.2.10
      src:
        type: string
        default: 198.51.100.20
      dst:
        type: string
        default: 203.0.113.10
      user:
        type: string
        default: labuser
      spt:
        type: integer
        default: 49152
      dpt:
        type: integer
        default: 443
  supported_modes:
  - push_webhook
- id: deny
  display_name: Deny
  description: Synthetic Fireware 12 deny event. See source field reference.
  default_transport: syslog
  template: scenarios/deny.json
  config_schema: *id001
  supported_modes:
  - push_webhook
- id: proxy
  display_name: Proxy
  description: Synthetic Fireware 12 proxy event. See source field reference.
  default_transport: syslog
  template: scenarios/proxy.json
  config_schema: *id001
  supported_modes:
  - push_webhook
- id: vpn
  display_name: Vpn
  description: Synthetic Fireware 12 vpn event. See source field reference.
  default_transport: syslog
  template: scenarios/vpn.json
  config_schema: *id001
  supported_modes:
  - push_webhook
- id: authentication
  display_name: Authentication
  description: Synthetic Fireware 12 authentication event. See source field reference.
  default_transport: syslog
  template: scenarios/authentication.json
  config_schema: *id001
  supported_modes:
  - push_webhook
supported_transports:
- syslog
- http_webhook
- azure_logs_ingestion
- azure_function_app
formats:
- native
field_references:
- https://www.watchguard.com/help/docs/help-center/en-US/Content/en-US/Fireware/logging/read_log-msg.html
schema_version: Fireware 12
compatibility: Representative synthetic wire format; live vendor parser validation
  required
