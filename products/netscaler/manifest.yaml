id: netscaler
display_name: Citrix NetScaler ADC / WAF
version: 1.0.0
supported_modes:
- push_webhook
supported_auth_methods:
- none
- basic
- bearer
- api_key_header
scenarios:
- id: access
  display_name: Access
  description: Synthetic NetScaler 14.1 access event. See source field reference.
  default_transport: syslog
  template: scenarios/access.json
  config_schema: &id001
    type: object
    additionalProperties: false
    properties:
      hostname:
        type: string
        default: sim-device-01
      device_ip:
        type: string
        default: 192.0.2.10
      src:
        type: string
        default: 198.51.100.20
      dst:
        type: string
        default: 203.0.113.10
      user:
        type: string
        default: labuser
      spt:
        type: integer
        default: 49152
      dpt:
        type: integer
        default: 443
  supported_modes:
  - push_webhook
- id: authentication
  display_name: Authentication
  description: Synthetic NetScaler 14.1 authentication event. See source field reference.
  default_transport: syslog
  template: scenarios/authentication.json
  config_schema: *id001
  supported_modes:
  - push_webhook
- id: waf
  display_name: Waf
  description: Synthetic NetScaler 14.1 waf event. See source field reference.
  default_transport: syslog
  template: scenarios/waf.json
  config_schema: *id001
  supported_modes:
  - push_webhook
- id: administration
  display_name: Administration
  description: Synthetic NetScaler 14.1 administration event. See source field reference.
  default_transport: syslog
  template: scenarios/administration.json
  config_schema: *id001
  supported_modes:
  - push_webhook
supported_transports:
- syslog
- http_webhook
- azure_logs_ingestion
formats:
- native
- cef
field_references:
- https://docs.netscaler.com/en-us/citrix-adc/current-release/application-firewall/logs.html
schema_version: NetScaler 14.1
compatibility: Representative synthetic wire format; live vendor parser validation
  required
