id: crowdstrike
display_name: CrowdStrike Falcon
version: 1.0.0
supported_modes:
- push_webhook
supported_auth_methods:
- none
- basic
- bearer
- api_key_header
scenarios:
- id: detection
  display_name: Detection
  description: Synthetic SIEM connector 2 detection event. See source field reference.
  default_transport: syslog
  template: scenarios/detection.json
  config_schema: &id001
    type: object
    additionalProperties: false
    properties:
      hostname:
        type: string
        default: sim-device-01
      device_ip:
        type: string
        default: 192.0.2.10
      src:
        type: string
        default: 198.51.100.20
      dst:
        type: string
        default: 203.0.113.10
      user:
        type: string
        default: labuser
      spt:
        type: integer
        default: 49152
      dpt:
        type: integer
        default: 443
  supported_modes:
  - push_webhook
- id: prevention
  display_name: Prevention
  description: Synthetic SIEM connector 2 prevention event. See source field reference.
  default_transport: syslog
  template: scenarios/prevention.json
  config_schema: *id001
  supported_modes:
  - push_webhook
- id: containment
  display_name: Containment
  description: Synthetic SIEM connector 2 containment event. See source field reference.
  default_transport: syslog
  template: scenarios/containment.json
  config_schema: *id001
  supported_modes:
  - push_webhook
supported_transports:
- syslog
- http_webhook
- azure_logs_ingestion
formats:
- cef
- json
field_references:
- https://www.crowdstrike.com/wp-content/brochures/falcon-connector/falcon-SIEM-connector-datasheet.pdf
schema_version: SIEM connector 2
compatibility: Synthetic ingestion; native service connector not reproduced
