id: sentinelone
display_name: SentinelOne
version: 1.0.0
supported_modes:
- push_webhook
supported_auth_methods:
- none
- basic
- bearer
- api_key_header
scenarios:
- id: threat
  display_name: Threat
  description: Synthetic Management API v2.1 threat event. See source field reference.
  default_transport: http_webhook
  template: scenarios/threat.json
  config_schema: &id001
    type: object
    additionalProperties: false
    properties:
      hostname:
        type: string
        default: sim-device-01
      device_ip:
        type: string
        default: 192.0.2.10
      src:
        type: string
        default: 198.51.100.20
      dst:
        type: string
        default: 203.0.113.10
      user:
        type: string
        default: labuser
      spt:
        type: integer
        default: 49152
      dpt:
        type: integer
        default: 443
  supported_modes:
  - push_webhook
- id: alert
  display_name: Alert
  description: Synthetic Management API v2.1 alert event. See source field reference.
  default_transport: http_webhook
  template: scenarios/alert.json
  config_schema: *id001
  supported_modes:
  - push_webhook
- id: agent-activity
  display_name: Agent Activity
  description: Synthetic Management API v2.1 agent-activity event. See source field
    reference.
  default_transport: http_webhook
  template: scenarios/agent-activity.json
  config_schema: *id001
  supported_modes:
  - push_webhook
supported_transports:
- syslog
- http_webhook
- azure_logs_ingestion
- azure_function_app
formats:
- json
field_references:
- https://learn.microsoft.com/en-us/azure/sentinel/data-connectors/sentinelone
schema_version: Management API v2.1
compatibility: Synthetic ingestion; native service connector not reproduced
