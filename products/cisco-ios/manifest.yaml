id: cisco-ios
display_name: Cisco IOS / IOS XE
version: 1.0.0
supported_modes:
- push_webhook
supported_auth_methods:
- none
- basic
- bearer
- api_key_header
scenarios:
- id: interface-change
  display_name: Interface Change
  description: Synthetic IOS XE 17 interface-change event. See source field reference.
  default_transport: syslog
  template: scenarios/interface-change.json
  config_schema: &id001
    type: object
    additionalProperties: false
    properties:
      hostname:
        type: string
        default: sim-device-01
      device_ip:
        type: string
        default: 192.0.2.10
      src:
        type: string
        default: 198.51.100.20
      dst:
        type: string
        default: 203.0.113.10
      user:
        type: string
        default: labuser
      spt:
        type: integer
        default: 49152
      dpt:
        type: integer
        default: 443
  supported_modes:
  - push_webhook
- id: acl-deny
  display_name: Acl Deny
  description: Synthetic IOS XE 17 acl-deny event. See source field reference.
  default_transport: syslog
  template: scenarios/acl-deny.json
  config_schema: *id001
  supported_modes:
  - push_webhook
- id: login
  display_name: Login
  description: Synthetic IOS XE 17 login event. See source field reference.
  default_transport: syslog
  template: scenarios/login.json
  config_schema: *id001
  supported_modes:
  - push_webhook
- id: configuration
  display_name: Configuration
  description: Synthetic IOS XE 17 configuration event. See source field reference.
  default_transport: syslog
  template: scenarios/configuration.json
  config_schema: *id001
  supported_modes:
  - push_webhook
supported_transports:
- syslog
- http_webhook
- azure_logs_ingestion
- azure_function_app
formats:
- native
field_references:
- https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/esm/configuration/xe-17/esm-xe-17-book.html
schema_version: IOS XE 17
compatibility: Representative synthetic wire format; live vendor parser validation
  required
