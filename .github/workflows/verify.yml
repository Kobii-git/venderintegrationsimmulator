name: Verify simulator

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - run: scripts/verify-backend.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: scripts/verify-frontend.sh

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - run: scripts/verify-migrations.sh

  browser-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: scripts/verify-browser.sh

  production-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: scripts/verify-docker.sh
      - run: docker build -f docker/Dockerfile -t integration-simulator:0.4.0 .
      - run: scripts/verify-standalone-image.sh

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, migrations, browser-workflows, production-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('backend/pyproject.toml').read_text())['project']['version']
          assert json.loads(Path('frontend/package.json').read_text())['version'] == version
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kobii-git/venderintegrationsimmulator
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          docker pull ghcr.io/kobii-git/venderintegrationsimmulator:sha-${{ github.sha }}
          scripts/verify-standalone-image.sh ghcr.io/kobii-git/venderintegrationsimmulator:sha-${{ github.sha }}
          DOCKER_DEFAULT_PLATFORM=linux/arm64 scripts/verify-standalone-image.sh ghcr.io/kobii-git/venderintegrationsimmulator:sha-${{ github.sha }}
