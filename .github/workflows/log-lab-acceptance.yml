name: Log lab deployment acceptance
on:
  workflow_dispatch:
jobs:
  multiarch-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: scripts/build-multiarch.sh /tmp/integration-simulator-0.4.7.oci.tar
      - uses: actions/upload-artifact@v4
        with:
          name: integration-simulator-0.4.7-multiarch
          path: /tmp/integration-simulator-0.4.7.oci.tar
  sustained-fanout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r backend/requirements.txt
      - run: |
          python scripts/benchmark-log-lab.py --prepare-ca --ca-dir /tmp/lab-certs
          docker build -f docker/Dockerfile -t integration-simulator:acceptance .
          docker run -d --name log-lab --network host --cpus=2 --memory=4g \
            -v /tmp/lab-certs:/certs:ro -v log-lab-data:/data integration-simulator:acceptance
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/ready; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/v1/ready
          python scripts/benchmark-log-lab.py --duration 900 --ca-dir /tmp/lab-certs \
            --collector-ca-file /certs/ca.pem --output /tmp/log-lab-benchmark.json
      - if: always()
        run: docker logs log-lab > /tmp/log-lab-container.log 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-sustained-fanout-results
          path: |
            /tmp/log-lab-benchmark.json
            /tmp/log-lab-container.log
      - if: always()
        run: docker rm -f log-lab; docker volume rm log-lab-data
